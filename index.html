  <!-- Adapter Firebase (Firestore + Storage) -->
  <script>
/* ==========================================================================
   SETIAKU - Adapter Firebase (Firestore + Storage + Anonymous Auth)
   Meniru API klien yang dipakai aplikasi: from().select/insert/update/delete,
   rpc(), storage.from().upload/getPublicUrl, channel().on().subscribe().
   Seluruh logika aplikasi di bawahnya TIDAK diubah.
   ========================================================================== */
(() => {
  'use strict';

  const DATA_TABLES = ['santri','kelas','setoran_tilawah','tugas','kegiatan','pengumuman',
    'pengumpulan_tugas','pendaftaran_kegiatan','riwayat_alpa','log_whatsapp','audit_logs'];
  const CONFIG_TABLES = ['pengaturan_aplikasi','kitabunaa_operational_v2'];
  const ALL_TABLES = DATA_TABLES.concat(CONFIG_TABLES);

  const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(16).slice(2);
  const docKey = v => String(v).replace(/\//g, '_');
  const plain = o => JSON.parse(JSON.stringify(o));
  const nowISO = () => new Date().toISOString();
  const mkErr = (message, code) => Object.assign(new Error(message), { code });
  const same = (a, b) => a === b || (a != null && b != null && String(a) === String(b));
  const withTimeout = (p, ms, label) => new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(mkErr((label || 'Operasi') + ' melebihi batas waktu. Periksa koneksi internet.', 'TIMEOUT')), ms);
    Promise.resolve(p).then(v => { clearTimeout(t); resolve(v); }, e => { clearTimeout(t); reject(e); });
  });

  /* Konfigurasi bawaan proyek Firebase SETIAKU (dipakai bila firebaseConfig di atas kosong / masih placeholder) */
  const BUILTIN_CONFIG = {
    apiKey: "AIzaSyCfywEB2oE6o3bXXwaIlRgkqjpmee3VzxY",
    authDomain: "sistem-monitoring-tilawa-25195.firebaseapp.com",
    projectId: "sistem-monitoring-tilawa-25195",
    storageBucket: "sistem-monitoring-tilawa-25195.firebasestorage.app",
    messagingSenderId: "179863473897",
    appId: "1:179863473897:web:a7c7bf3524951ae7b52a78"
  };
  const validCfg = c => !!(c && c.apiKey && c.projectId && !/ANDA|PROJECT_ID|SENDER_ID|APP_ID/.test(String(c.apiKey) + String(c.projectId)));
  function resolveConfig(cfg) {
    return [cfg, window.firebaseConfig, BUILTIN_CONFIG].find(validCfg) || null;
  }
  function isConfigured(cfg) { return !!resolveConfig(cfg); }

  /* Pemuat SDK cadangan: bila <script> gstatic di <head> gagal/terblokir, coba CDN lain */
  const SDK_VER = '10.12.2';
  const SDK_BASES = [
    'https://www.gstatic.com/firebasejs/' + SDK_VER + '/',
    'https://cdn.jsdelivr.net/npm/firebase@' + SDK_VER + '/',
    'https://unpkg.com/firebase@' + SDK_VER + '/'
  ];
  const SDK_MODS = [
    { f: 'firebase-app-compat.js',       ok: () => !!window.firebase, must: true },
    { f: 'firebase-firestore-compat.js', ok: () => !!(window.firebase && firebase.firestore), must: true },
    { f: 'firebase-auth-compat.js',      ok: () => !!(window.firebase && firebase.auth), must: false }
  ];
  const sdkReady = () => !!(window.firebase && firebase.initializeApp && firebase.firestore);
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      const timer = setTimeout(() => { el.remove(); reject(new Error('Timeout memuat ' + src)); }, 20000);
      el.src = src; el.async = false;
      el.onload = () => { clearTimeout(timer); resolve(); };
      el.onerror = () => { clearTimeout(timer); el.remove(); reject(new Error('Gagal memuat ' + src)); };
      document.head.appendChild(el);
    });
  }
  let sdkPromise = null;
  function ensureSdk() {
    if (sdkReady()) return Promise.resolve(true);
    if (sdkPromise) return sdkPromise;
    sdkPromise = (async () => {
      for (const mod of SDK_MODS) {
        if (mod.ok()) continue;
        for (const base of SDK_BASES) {
          try { await loadScript(base + mod.f); } catch (e) { console.warn(e.message); }
          if (mod.ok()) break;
        }
        if (!mod.ok() && mod.must) {
          throw new Error('SDK Firebase gagal dimuat. Periksa koneksi internet, atau pemblokir iklan/jaringan yang memblokir gstatic.com.');
        }
      }
      return true;
    })();
    sdkPromise.catch(() => { sdkPromise = null; });
    return sdkPromise;
  }

  function createClient(cfg) {
    cfg = resolveConfig(cfg);
    if (!cfg) throw new Error('firebaseConfig belum valid (apiKey/projectId kosong).');
    window.firebaseConfig = cfg;
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
    const db = firebase.firestore(app);
    try { db.settings({ ignoreUndefinedProperties: true, experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
    /* Cache lokal (IndexedDB): data tampil instan saat dibuka ulang, lalu disinkronkan dari server */
    try { db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn('Cache offline Firestore tidak aktif:', e.code || e.message)); } catch (e) {}
    const FV = firebase.firestore.FieldValue;

    /* ---------- Cache lokal + listener (menghemat jumlah read Firestore) ---------- */
    const store = {};           // tabel -> { map:Map, ready:Promise }
    const emitters = new Set(); // callback realtime
    const emit = () => emitters.forEach(fn => { try { fn(); } catch (e) { console.warn(e); } });
    const rowOf = d => { const v = d.data() || {}; if (v.id === undefined || v.id === null) v.id = d.id; return v; };

    let ready;
    function watch(table) {
      if (store[table]) return store[table].ready;
      const entry = { map: new Map(), unsub: null };
      entry.ready = (async () => {
        await ready;
        await new Promise((resolve, reject) => {
          let first = true;
          const timer = setTimeout(() => { if (first) reject(mkErr('Memuat ' + table + ' melebihi batas waktu.', 'TIMEOUT')); }, 25000);
          entry.unsub = db.collection(table).onSnapshot(snap => {
            snap.docChanges().forEach(ch => {
              if (ch.type === 'removed') entry.map.delete(ch.doc.id);
              else entry.map.set(ch.doc.id, rowOf(ch.doc));
            });
            if (first) { first = false; clearTimeout(timer); resolve(); return; }
            if (!snap.metadata.hasPendingWrites && snap.docChanges().length) emit();
          }, error => {
            if (first) { first = false; clearTimeout(timer); reject(error); }
            else console.warn('Listener ' + table + ':', error.message);
          });
        });
        return entry;
      })();
      entry.ready.catch(() => { if (store[table] === entry) { try { entry.unsub && entry.unsub(); } catch (e) {} delete store[table]; } });
      store[table] = entry;
      return entry.ready;
    }
    async function rowsOf(table) { await watch(table); return Array.from(store[table].map.values()); }
    function cacheSet(table, key, row) { if (store[table]) store[table].map.set(key, row); }
    function cacheDel(table, key) { if (store[table]) store[table].map.delete(key); }

    const SOFT_COMMIT_MS = 5000;
    function notifyWriteError(e) {
      console.warn('Penulisan Firestore gagal:', e);
      try {
        if (typeof showToast === 'function') {
          showToast(e && e.code === 'permission-denied'
            ? 'Data ditolak server. Periksa Firestore Rules dan Anonymous Auth.'
            : 'Sebagian data belum tersimpan ke server: ' + ((e && e.message) || e), 'error');
        }
      } catch (x) {}
    }
    async function commit(ops) { // ops: [{type:'set'|'delete', ref, data, merge}]
      for (let i = 0; i < ops.length; i += 400) {
        const batch = db.batch();
        ops.slice(i, i + 400).forEach(op => {
          if (op.type === 'delete') batch.delete(op.ref);
          else batch.set(op.ref, op.data, { merge: !!op.merge });
        });
        const p = batch.commit();
        /* Data sudah tersimpan di cache lokal seketika. Bila server lambat, jangan membuat layar menunggu:
           lanjutkan setelah SOFT_COMMIT_MS; Firestore tetap mengirim di latar belakang & mengabari bila ditolak. */
        await new Promise((resolve, reject) => {
          let done = false;
          const t = setTimeout(() => { if (!done) { done = true; p.catch(notifyWriteError); resolve(); } }, SOFT_COMMIT_MS);
          p.then(() => { if (!done) { done = true; clearTimeout(t); resolve(); } },
                 e => { if (!done) { done = true; clearTimeout(t); reject(e); } });
        });
      }
    }

    /* ---------- Query builder bergaya klien SQL ---------- */
    class Query {
      constructor(table) { this.t = table; this.op = 'select'; this.f = []; this.ord = null; this.lim = null; this.vals = null; this.ret = false; this.one = null; }
      select() { if (this.op !== 'select') this.ret = true; return this; }
      insert(v) { this.op = 'insert'; this.vals = Array.isArray(v) ? v : [v]; return this; }
      update(v) { this.op = 'update'; this.vals = v; return this; }
      delete() { this.op = 'delete'; return this; }
      eq(c, v) { this.f.push(['eq', c, v]); return this; }
      neq(c, v) { this.f.push(['neq', c, v]); return this; }
      in(c, v) { this.f.push(['in', c, v]); return this; }
      order(c, o) { this.ord = { c, asc: !(o && o.ascending === false) }; return this; }
      limit(n) { this.lim = n; return this; }
      single() { this.one = 'single'; return this; }
      maybeSingle() { this.one = 'maybe'; return this; }
      then(res, rej) { return this._run().then(res, rej); }
      match(row) {
        return this.f.every(([k, c, v]) => k === 'eq' ? same(row[c], v)
          : k === 'neq' ? (row[c] != null && !same(row[c], v))
          : (v || []).some(x => same(row[c], x)));
      }
      _finish(rows) {
        if (this.one) {
          if (rows.length === 1) return { data: rows[0], error: null };
          if (this.one === 'maybe' && rows.length === 0) return { data: null, error: null };
          return { data: null, error: { code: 'PGRST116', message: 'JSON object requested, multiple (or no) rows returned' } };
        }
        return { data: rows, error: null };
      }
      async _run() {
        try {
          const t = this.t;
          const idOnly = this.f.length === 1 && this.f[0][0] === 'eq' && this.f[0][1] === 'id';
          if (this.op === 'select') {
            let rows = (await rowsOf(t)).filter(r => this.match(r));
            rows.sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
            if (this.ord) {
              const { c, asc } = this.ord;
              rows.sort((a, b) => {
                const x = a[c], y = b[c];
                if (x == null && y == null) return 0;
                if (x == null) return 1;
                if (y == null) return -1;
                const r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y));
                return asc ? r : -r;
              });
            }
            if (this.lim != null) rows = rows.slice(0, this.lim);
            return this._finish(rows);
          }
          await ready;
          const col = db.collection(t);
          if (this.op === 'insert') {
            const out = []; const ops = [];
            this.vals.forEach(v => {
              const row = plain(v);
              if (row.id === undefined || row.id === null) row.id = uid();
              if (!row.created_at) row.created_at = nowISO();
              ops.push({ type: 'set', ref: col.doc(docKey(row.id)), data: row });
              out.push(row);
            });
            await commit(ops);
            out.forEach(r => cacheSet(t, docKey(r.id), r));
            return this.ret ? this._finish(out) : { data: null, error: null };
          }
          let targets;
          if (idOnly) {
            const key = docKey(this.f[0][2]);
            const cached = store[t] && store[t].map.get(key);
            if (cached) targets = [cached];
            else {
              const snap = await withTimeout(col.doc(key).get(), 20000, 'Membaca data');
              targets = snap.exists ? [rowOf(snap)] : [];
            }
          } else {
            targets = (await rowsOf(t)).filter(r => this.match(r));
          }
          if (this.op === 'update') {
            const patch = plain(this.vals);
            const out = targets.map(r => Object.assign({}, r, patch));
            await commit(out.map(r => ({ type: 'set', ref: col.doc(docKey(r.id)), data: patch, merge: true })));
            out.forEach(r => cacheSet(t, docKey(r.id), r));
            return this.ret ? this._finish(out) : { data: null, error: null };
          }
          if (this.op === 'delete') {
            if (idOnly && !targets.length) targets = [{ id: this.f[0][2] }];
            await commit(targets.map(r => ({ type: 'delete', ref: col.doc(docKey(r.id)) })));
            targets.forEach(r => cacheDel(t, docKey(r.id)));
            return { data: null, error: null };
          }
          return { data: null, error: null };
        } catch (e) {
          return { data: null, error: { message: e && e.message ? e.message : String(e), code: e && e.code } };
        }
      }
    }

    /* ---------- Waktu server (pengganti RPC kitabunaa_server_time) ---------- */
    const deviceId = (() => { try { let d = localStorage.getItem('ktb_device_id'); if (!d) { d = uid(); localStorage.setItem('ktb_device_id', d); } return d; } catch (e) { return uid(); } })();
    let clockOffset = 0, clockAt = 0;
    async function serverNow() {
      if (clockAt && Date.now() - clockAt < 600000) return Date.now() + clockOffset;
      try {
        await ready;
        const t0 = Date.now();
        const ref = db.collection('_clock').doc(deviceId);
        await withTimeout(ref.set({ t: FV.serverTimestamp() }), 10000, 'Sinkron jam server');
        const snap = await withTimeout(ref.get({ source: 'server' }), 10000, 'Sinkron jam server');
        const t1 = Date.now();
        clockOffset = snap.data().t.toMillis() - (t0 + t1) / 2;
        clockAt = t1;
      } catch (e) {
        console.warn('Jam server Firebase tidak terbaca, memakai offset terakhir:', e.message);
        if (!clockAt) { clockOffset = 0; }
        clockAt = Date.now() - 540000; // coba lagi sekitar 1 menit
      }
      return Date.now() + clockOffset;
    }
    const serverISO = async () => new Date(await serverNow()).toISOString();

    /* ---------- Setup database otomatis ---------- */
    async function autoSetupDatabase() {
      const cfgState = (typeof state !== 'undefined' && state.config) ? state.config : {};
      const pRef = db.collection('pengaturan_aplikasi').doc('1');
      const oRef = db.collection('kitabunaa_operational_v2').doc('1');
      const [p, o] = await Promise.all([pRef.get(), oRef.get()]);
      if (!p.exists) {
        await pRef.set({ id: 1, admin_username: cfgState.adminUsername || 'admin', admin_password: cfgState.adminPassword || 'admin123',
          jam_pengingat: cfgState.jamPengingat || '16:00', batas_alpa: cfgState.batasAlpa || 3, auto_block: cfgState.autoBlockEnabled !== false,
          created_at: nowISO() });
      }
      if (!o.exists) {
        await oRef.set({ id: 1, jam_buka: cfgState.jamBuka || '04:00', jam_tutup: cfgState.jamTutup || '18:00',
          jam_pengingat: cfgState.jamPengingat || '16:00', batas_alpa: cfgState.batasAlpa || 3,
          auto_block: cfgState.autoBlockEnabled !== false, wa_schedule: cfgState.waAutoScheduleEnabled !== false, created_at: nowISO() });
      }
    }

    ready = (async () => {
      try {
        if (firebase.auth && !firebase.auth().currentUser) await firebase.auth().signInAnonymously();
      } catch (e) {
        console.warn('Firebase Anonymous Auth belum aktif (aktifkan di Authentication > Sign-in method) atau rules tidak butuh login:', e.code || e.message);
      }
      try { await autoSetupDatabase(); } catch (e) { console.warn('autoSetupDatabase:', e.message); }
    })();

    /* ---------- Pengganti fungsi RPC server ---------- */
    async function getOps() {
      await ready;
      const snap = await withTimeout(db.collection('kitabunaa_operational_v2').doc('1').get(), 20000, 'Membaca pengaturan operasional');
      if (!snap.exists) throw mkErr('Dokumen pengaturan operasional belum tersedia.');
      return snap.data();
    }
    async function opsSnapshot() {
      const d = await getOps();
      const keys = ['jam_buka', 'jam_tutup', 'jam_pengingat', 'batas_alpa', 'auto_block', 'wa_schedule'];
      const settings = {};
      keys.forEach(k => { if (d[k] != null) settings[k] = k.startsWith('jam_') ? String(d[k]).slice(0, 5) : d[k]; });
      return { server_time: await serverISO(), settings };
    }
    async function verifyAdmin(user, pass) {
      const snap = await db.collection('pengaturan_aplikasi').doc('1').get();
      const d = snap.exists ? snap.data() : {};
      const u = d.admin_username || 'admin', p = d.admin_password || 'admin123';
      if (String(user) !== String(u) || String(pass) !== String(p)) throw mkErr('Kredensial admin tidak valid.', 'AUTH');
    }
    async function saveOps(args) {
      await ready;
      await verifyAdmin(args.p_username, args.p_password);
      const s = args.p_settings || {};
      const ops = { id: 1, updated_at: nowISO() };
      ['jam_buka', 'jam_tutup', 'jam_pengingat', 'batas_alpa', 'auto_block', 'wa_schedule'].forEach(k => { if (s[k] !== undefined) ops[k] = s[k]; });
      await withTimeout(db.collection('kitabunaa_operational_v2').doc('1').set(plain(ops), { merge: true }), 20000, 'Menyimpan pengaturan');
      const mirror = { id: 1 };
      ['jam_pengingat', 'batas_alpa', 'auto_block'].forEach(k => { if (s[k] !== undefined) mirror[k] = s[k]; });
      if (s.fonnte_token !== undefined) mirror.fonnte_token = s.fonnte_token;
      await withTimeout(db.collection('pengaturan_aplikasi').doc('1').set(plain(mirror), { merge: true }), 20000, 'Menyimpan pengaturan');
      return opsSnapshot();
    }

    const hm = s => { const x = String(s || '').match(/(\d{1,2}):(\d{2})/); return x ? Number(x[1]) * 60 + Number(x[2]) : 0; };
    const addDays = (d, n) => new Date(Date.parse(d + 'T12:00:00Z') + n * 86400000).toISOString().slice(0, 10);
    async function evaluateAlpa() {
      const cfg = await getOps();
      const w = new Date((await serverNow()) + 7 * 3600000); // WIB
      const today = w.toISOString().slice(0, 10);
      const m = w.getUTCHours() * 60 + w.getUTCMinutes();
      const a = hm(cfg.jam_buka), b = hm(cfg.jam_tutup);
      const target = a < b ? (m >= b ? today : addDays(today, -1)) : (m < b ? addDays(today, -2) : addDays(today, -1));
      const batas = Number(cfg.batas_alpa) || 3;

      // klaim hari evaluasi (mencegah hitung ganda antar perangkat)
      const mark = db.collection('_alpa_eval').doc(target);
      const claimed = await db.runTransaction(async tx => {
        const s = await tx.get(mark);
        if (s.exists) return false;
        tx.set(mark, { tanggal: target, created_at: nowISO(), by: deviceId });
        return true;
      });
      if (!claimed) return 0;
      try {
        const santriRows = await rowsOf('santri');
        const setoranRows = await rowsOf('setoran_tilawah');
        const sudah = new Set(setoranRows.filter(r => r.tanggal === target).map(r => String(r.santri_id)));
        const ops = []; let count = 0;
        santriRows.forEach(s => {
          if (s.status_akun !== 'aktif' || sudah.has(String(s.id))) return;
          if (s.tanggal_bergabung && String(s.tanggal_bergabung).slice(0, 10) > target) return;
          const total = (Number(s.total_alpa) || 0) + 1;
          const upd = { total_alpa: total };
          if (cfg.auto_block !== false && total >= batas) {
            upd.status_akun = 'terblokir';
            upd.alasan_blokir = 'Akun diblokir karena mencapai ' + batas + ' kali alpa setoran.';
          }
          ops.push({ type: 'set', ref: db.collection('riwayat_alpa').doc('alpa_' + docKey(s.id) + '_' + target),
            data: { id: 'alpa_' + docKey(s.id) + '_' + target, santri_id: s.id, tanggal: target, keterangan: 'Tidak mengirim setoran tilawah', created_at: nowISO() } });
          ops.push({ type: 'set', ref: db.collection('santri').doc(docKey(s.id)), data: upd, merge: true });
          cacheSet('santri', docKey(s.id), Object.assign({}, s, upd));
          count++;
        });
        await commit(ops);
        return count;
      } catch (e) {
        try { await mark.delete(); } catch (x) {}
        throw e;
      }
    }

    async function rpc(name, args) {
      try {
        switch (name) {
          case 'kitabunaa_server_time': return { data: await serverISO(), error: null };
          case 'kitabunaa_operational_snapshot_v3': return { data: await opsSnapshot(), error: null };
          case 'kitabunaa_save_operational_v2':
          case 'kitabunaa_save_operational_v3': return { data: await saveOps(args || {}), error: null };
          case 'kitabunaa_evaluate_alpa_v2': return { data: await evaluateAlpa(), error: null };
          default: return { data: null, error: { message: 'Fungsi ' + name + ' tidak tersedia di Firebase.' } };
        }
      } catch (e) { return { data: null, error: { message: e.message || String(e), code: e.code } }; }
    }

    /* ---------- Penyimpanan berkas GRATIS (tanpa Firebase Storage) ----------
       Foto kecil  : disimpan sebagai data-URL di dokumen.
       Audio/video : dipecah menjadi potongan biner di koleksi Firestore "media_chunks" (maks. 10 MB per berkas). */
    const urlCache = new Map();
    const toDataUrl = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(f); });

      const col = db.collection('media_chunks');
      const mime = file.type || 'application/octet-stream';
      for (let i = 0; i < total; i += 2) {
        await retry(async () => {

          (_, k) => retry(() => withTimeout(col.doc(id + '_' + (k + 1)).get(), 60000, 'Memuat rekaman'), 2)));

    function wibParts(date = new Date(Date.now() + serverClockOffset)) {
      return Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Jakarta', year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
      }).formatToParts(date).filter(p => p.type !== 'literal').map(p => [p.type,p.value]));
    }
    function wibDate(date) {
      const p = wibParts(date); return `${p.year}-${p.month}-${p.day}`;
    }

    // ===== Jam berjalan (WIB) bergaya Finflow untuk panel admin & santri =====
    const HARI_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    function liveClockParts() {
      const p = wibParts();
      const dayIdx = new Date(Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day))).getUTCDay();
      return {
        time: `${p.hour}:${p.minute}:${p.second}`,
        date: `${HARI_ID[dayIdx]}, ${Number(p.day)} ${BULAN_ID[Number(p.month) - 1]} ${p.year}`
      };
    }

      const c = liveClockParts();
      if (variant === 'topbar') {

    }

    function updateLiveClocks() {
      const c = liveClockParts();
      document.querySelectorAll('.js-live-time').forEach(el => { if (el.textContent !== c.time) el.textContent = c.time; });
      document.querySelectorAll('.js-live-date').forEach(el => { if (el.textContent !== c.date) el.textContent = c.date; });
    }

    let operationalBusy = false;
    async function loadOperationalSettings() {
      if (!dbClient) return;
      const {data,error} = await dbClient.from('kitabunaa_operational_v2').select('*').eq('id',1).single();
      if(error) throw error;
      const mapping = {jam_buka:'jamBuka',jam_tutup:'jamTutup',jam_pengingat:'jamPengingat',
        batas_alpa:'batasAlpa',auto_block:'autoBlockEnabled',wa_schedule:'waAutoScheduleEnabled'};
      for(const [key,target] of Object.entries(mapping))
        if(data[key]!=null) state.config[target] = key.startsWith('jam_') ? data[key].slice(0,5) : data[key];
      updateSetoranLock();
    }
    function operationalDate() {
      const p = wibParts();
      const day = `${p.year}-${p.month}-${p.day}`;
      const a = parseWaktuKeMenit(state.config.jamBuka), b = parseWaktuKeMenit(state.config.jamTutup);
      if(a > b && Number(p.hour)*60+Number(p.minute) < a) {
        return new Date(Date.parse(day+'T12:00:00Z')-86400000).toISOString().slice(0,10);
      }
      return day;
    }
    function setoranOpen() {
      const p = wibParts(); const m = Number(p.hour)*60 + Number(p.minute);
      const a = parseWaktuKeMenit(state.config.jamBuka), b = parseWaktuKeMenit(state.config.jamTutup);
      return a < b ? m >= a && m < b : m >= a || m < b;
    }
    async function syncServerClock() {
      if (!dbClient) return;
      const start = Date.now();
      const {data,error} = await dbClient.rpc('kitabunaa_server_time');
      if (!error && data) serverClockOffset = Date.parse(data) - (start + Date.now())/2;
    }
    function updateSetoranLock() {
      const btn = document.getElementById('btn-kirim-setoran');
      if (!btn) return;
      const open = setoranOpen();
      const disabledNow = setoranBusy || !open;
      if (btn.disabled !== disabledNow) btn.disabled = disabledNow;
      btn.classList.toggle('opacity-50', disabledNow);
      btn.classList.toggle('cursor-not-allowed', disabledNow);
      const label = setoranBusy ? 'Mengunggah dan menyimpan\u2026' : open
        ? 'Kirim Setoran Tilawah Sekarang 🚀' : `Setoran ditutup \u2014 buka pukul ${state.config.jamBuka} WIB`;
      if (btn.textContent !== label) btn.textContent = label;
      const info = document.getElementById('info-jam-setoran');
      const infoText = open ? `Setoran dibuka sampai sebelum pukul ${state.config.jamTutup} WIB.`
        : `Jam operasional tutup. Buka kembali pukul ${state.config.jamBuka} WIB. (Jika sedang sakit, gunakan tab Izin Sakit di atas agar tidak dianggap Alpa).`;
      if (info && info.textContent !== infoText) info.textContent = infoText;
    }
    /* Perkecil foto sebelum diunggah: dari beberapa MB menjadi puluhan KB (unggah jauh lebih cepat) */
    async function compressImageFile(file, maxDim, quality) {
      try {
        if (!file || !/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type || '')) return file;
        let bmp = null;
        if (window.createImageBitmap) {
          try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = null; }
        }
        if (!bmp) {
          bmp = await new Promise((resolve, reject) => {
            const img = new Image(); const u = URL.createObjectURL(file);
            img.onload = () => { URL.revokeObjectURL(u); resolve(img); };
            img.onerror = () => { URL.revokeObjectURL(u); reject(new Error('gambar tidak terbaca')); };
            img.src = u;
          });
        }
        const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
        const scale = Math.min(1, maxDim / Math.max(w0, h0));
        if (scale >= 1 && file.size <= 200 * 1024) { if (bmp.close) bmp.close(); return file; }
        const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(bmp, 0, 0, w, h);
        if (bmp.close) bmp.close();
        const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', quality));
        if (!blob || blob.size >= file.size) return file;
        return new File([blob], (file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg', lastModified: Date.now() });
      } catch (e) { return file; }

    /* ===== Pemampat audio/video di perangkat (agar muat di penyimpanan Firestore yang gratis) ===== */
    const MEDIA_MAX_BYTES = 10 * 1024 * 1024;
    function loadScriptOnce(src) {
      return new Promise((res, rej) => {
        const el = document.createElement('script');
        el.src = src; el.onload = res; el.onerror = () => { el.remove(); rej(new Error('Gagal memuat ' + src)); };
        document.head.appendChild(el);
      });
    }
    async function ensureLame() {
      if (window.lamejs) return;
      for (const u of ['https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js', 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js']) {
        try { await loadScriptOnce(u); if (window.lamejs) return; } catch (e) { console.warn(e.message); }
      }
      throw new Error('Pemampat audio gagal dimuat.');
    }
    async function compressAudioFile(file) {
      await ensureLame();
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error('Peramban tidak mendukung pemampatan audio.');
      let ctx;
      try { ctx = new AC({ sampleRate: 22050 }); } catch (e) { ctx = new AC(); }
      try {
        const raw = await file.arrayBuffer();
        const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(raw, res, rej); if (p && p.then) p.then(res, rej); });
        const n = buf.length, ch = buf.numberOfChannels, rate = buf.sampleRate;
        let mono = new Float32Array(n);
        for (let c = 0; c < ch; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / ch; }
        const TARGET = 22050;
        if (rate !== TARGET) {
          const m = Math.floor(n * TARGET / rate), out = new Float32Array(m), r = rate / TARGET;
          for (let i = 0; i < m; i++) {
            const pos = i * r, i0 = Math.floor(pos), i1 = Math.min(n - 1, i0 + 1), f = pos - i0;
            out[i] = mono[i0] * (1 - f) + mono[i1] * f;
          }
          mono = out;
        }
        const pcm = new Int16Array(mono.length);
        for (let i = 0; i < mono.length; i++) { const v = Math.max(-1, Math.min(1, mono[i])); pcm[i] = v < 0 ? v * 0x8000 : v * 0x7FFF; }
        const enc = new window.lamejs.Mp3Encoder(1, TARGET, 32);
        const parts = [];
        for (let i = 0, k = 0; i < pcm.length; i += 1152, k++) {
          const b = enc.encodeBuffer(pcm.subarray(i, i + 1152));
          if (b.length) parts.push(new Uint8Array(b));
          if (k % 300 === 0) await new Promise(r => setTimeout(r));
        }
        const end = enc.flush();
        if (end.length) parts.push(new Uint8Array(end));
        const base = (file.name || 'rekaman').replace(/\.[^.]+$/, '');
        return new File(parts, base + '.mp3', { type: 'audio/mpeg', lastModified: Date.now() });
      } finally { try { ctx.close && ctx.close(); } catch (e) {} }
    }
    async function compressVideoFile(file) {
      const v = document.createElement('video');
      const url = URL.createObjectURL(file);
      try {
        v.src = url; v.playsInline = true; v.preload = 'auto';
        await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error('Video tidak dapat dibaca.')); });
        const dur = v.duration;
        if (!isFinite(dur) || dur <= 0) throw new Error('Durasi video tidak terbaca.');
        if (dur > 480) throw new Error('Durasi video maksimal 8 menit.');
        const cap = v.captureStream || v.mozCaptureStream;
        const mime = window.MediaRecorder && ['video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
        if (!cap || !mime) throw new Error('Peramban ini belum bisa memperkecil video. Kirim sebagai audio, atau rekam video lebih singkat/kualitas lebih rendah (maks. 10 MB).');
        const vBps = Math.max(100000, Math.min(900000, Math.floor((9 * 1024 * 1024 * 8) / dur) - 48000));
        const rec = new MediaRecorder(cap.call(v), { mimeType: mime, videoBitsPerSecond: vBps, audioBitsPerSecond: 48000 });
        const chunks = [];
        rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        const done = new Promise(res => { rec.onstop = res; });
        v.onended = () => { try { rec.stop(); } catch (e) {} };
        rec.start(1000);
        try { await v.play(); } catch (e) { try { rec.stop(); } catch (x) {} throw new Error('Peramban menolak memproses video. Coba lagi.'); }
        const tick = setInterval(() => {
          if (typeof showToast === 'function') showToast('Memperkecil video… ' + Math.min(99, Math.round(v.currentTime / dur * 100)) + '% (jangan tutup halaman)', 'info');
        }, 5000);
        try { await done; } finally { clearInterval(tick); }
        const out = new Blob(chunks, { type: 'video/webm' });
        const base = (file.name || 'video').replace(/\.[^.]+$/, '');
        return new File([out], base + '.webm', { type: 'video/webm', lastModified: Date.now() });
      } finally { URL.revokeObjectURL(url); }
    }
    async function shrinkMedia(file) {
      let type = String(file.type || '');
      if (!type) {
        const n = String(file.name || '').toLowerCase();
        if (/\.(mp3|m4a|wav|ogg|aac|opus|amr|flac)$/.test(n)) type = 'audio/x';
        else if (/\.(mp4|mov|webm|mkv|3gp|m4v)$/.test(n)) type = 'video/x';
      }
      if (type.indexOf('audio/') === 0 && file.size > 300000) {
        try {
          if (typeof showToast === 'function') showToast('Memperkecil ukuran rekaman…', 'info');
          const out = await compressAudioFile(file);
          if (out && out.size > 0 && out.size < file.size) return out;
        } catch (e) { console.warn('Kompres audio gagal:', e); }
        return file;
      }
      if (type.indexOf('video/') === 0 && file.size > 8 * 1024 * 1024) {
        try {
          if (typeof showToast === 'function') showToast('Video besar, sedang diperkecil sesuai durasinya…', 'info');
          const out = await compressVideoFile(file);
          if (out && out.size > 0 && out.size < file.size) return out;
        } catch (e) {
          console.warn('Kompres video gagal:', e);
          if (file.size > MEDIA_MAX_BYTES) throw e;
        }
      }
      return file;
    }
    async function uploadPermanent(file, folder) {
      if (!dbClient) throw new Error('Hubungkan Firebase terlebih dahulu agar berkas tersimpan permanen.');
      if (file && file.type && file.type.indexOf('image/') === 0) {
        file = folder === 'foto-santri' ? await compressImageFile(file, 480, 0.8) : await compressImageFile(file, 1280, 0.82);
      } else if (file) {
        file = await shrinkMedia(file);
      }
      const safeName = (file.name || 'media').replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `${folder}/${crypto.randomUUID()}/${safeName}`;
      const {error} = await dbClient.storage.from(MEDIA_BUCKET).upload(path, file, {
        cacheControl:'31536000', upsert:false, contentType:file.type || 'application/octet-stream'
      });
      if (error) throw error;
      const {data} = dbClient.storage.from(MEDIA_BUCKET).getPublicUrl(path);
      return data.publicUrl;
    }
    async function persistRecord(table, row, updateId) {
      if (!dbClient) throw new Error('Firebase belum terhubung. Data belum disimpan ke server.');
      const query = updateId ? dbClient.from(table).update(row).eq('id',updateId)
        : dbClient.from(table).insert([row]);
      const {data,error} = await query.select().single();
      if (error) throw error;
      return data;
    }

          saveState();
          showToast('Gagal menyimpan: ' + (err.message || String(err)), 'error');

    /* ---- Helper Revisi 4: teks aman & anti-entitas mentah ---- */
    function escapeHtmlText(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function decodeNumericEntities(v) {
      return String(v ?? '').replace(/&#(x?)([0-9a-f]+);/gi, (m, hex, code) => {
        const n = parseInt(code, hex ? 16 : 10);
        return Number.isFinite(n) && n > 0 && n <= 0x10FFFF ? String.fromCodePoint(n) : m;
      });
    }

    function cleanWhatsAppText(str) {
      if (!str) return '';
      return str
        .replace(/&#8217;/g, "'")
        .replace(/&#8216;/g, "'")
        .replace(/&rsquo;/g, "'")
        .replace(/&lsquo;/g, "'")
        .replace(/[\u2019\u2018]/g, "'");
    }

    function getMediaSource(key, fallbackUrl) {
      if (localMediaBlobs[key]) {
        return localMediaBlobs[key];
      }
      if (fallbackUrl && String(fallbackUrl).indexOf('blob:') === 0) return ''; // alamat sementara milik perangkat lain
      return fallbackUrl || '';
    }

    /* ===== Pencocokan catatan setoran <-> santri, foto santri, dan pemutar rekaman ===== */
    const FOTO_BAWAAN = 'https://images.unsplash.com/photo-1544717305-2782549b5136?w=200&auto=format&fit=crop&q=80';
    const idStr = v => (v === undefined || v === null) ? '' : String(v);
    const normKunci = v => String(v == null ? '' : v).toLowerCase().replace(/[\s\-_.]/g, '');
    function findSantriById(id) {
      const key = idStr(id);
      if (!key) return null;
      return state.santri.find(s => idStr(s.id) === key) || null;
    }
    function findSantriBySetoran(st) {
      if (!st) return null;
      const direct = findSantriById(st.santri_id);
      if (direct) return direct;
      const nis = normKunci(st.santri_nis), usr = normKunci(st.santri_username), nama = normKunci(st.santri_nama);
      let hit = null;
      if (nis) hit = state.santri.find(s => normKunci(s.nis) === nis) || null;
      if (!hit && usr) hit = state.santri.find(s => normKunci(s.username) === usr) || null;
      if (!hit && nama) {
        const c = state.santri.filter(s => normKunci(s.nama_lengkap) === nama);
        if (c.length === 1) hit = c[0];
      }
      return hit;
    }
    function fotoSantri(s) {
      const u = s && s.foto_url ? String(s.foto_url) : '';
      return (u && u.indexOf('blob:') !== 0) ? u : FOTO_BAWAAN;
    }
    /* Samakan santri_id pada catatan setoran dengan id santri yang sebenarnya di database */
    function reconcileSetoranOwners(persist) {
      if (!Array.isArray(state.setoran) || !Array.isArray(state.santri) || !state.santri.length) return 0;
      let changed = 0;
      state.setoran.forEach(st => {
        const direct = findSantriById(st.santri_id);
        if (direct) { if (st.santri_id !== direct.id) st.santri_id = direct.id; return; }
        const hit = findSantriBySetoran(st);
        if (!hit) return;
        st.santri_id = hit.id;
        changed++;
        if (persist && dbClient && currentUser && currentUser.role === 'admin') {
          dbClient.from('setoran_tilawah').update({ santri_id: hit.id }).eq('id', st.id).then(() => {});
        }
      });
      return changed;
    }
    function renderMediaPlayer(st, src, videoCls, autoplay) {
      const ap = autoplay ? ' autoplay' : '';
      if (!src) {
        return `<p class="text-[11px] font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2 text-left">⚠ Berkas rekaman tidak tersedia di server (unggahan dari perangkat santri tidak sampai). Minta santri mengirim ulang setorannya.</p>`;
      }
      const player = (st && st.tipe_file === 'video')
        ? `<video controls${ap} playsinline preload="metadata" src="${src}" class="w-full rounded-2xl bg-slate-950 ${videoCls || 'max-h-48'}"></video>`
        : `<audio controls${ap} preload="metadata" src="${src}" class="w-full"></audio>`;
      const dl = /^(https?:|data:)/i.test(src)
        ? `<a href="${src}" target="_blank" rel="noopener" download="${escapeHtmlText((st && st.file_nama) || 'rekaman')}" class="inline-block mt-1.5 text-[11px] font-extrabold text-blue-700 hover:underline">⬇ Unduh rekaman</a>`
        : '';
      return player + dl;
    }
    function openRelinkSetoran(setoranId) {
      const st = state.setoran.find(i => i.id === setoranId);
      if (!st) return;
      const sama = state.setoran.filter(i => idStr(i.santri_id) === idStr(st.santri_id) && !findSantriById(i.santri_id)).length;
      const opts = [...state.santri]

            <button type="button" onclick="executeRelinkSetoran('${st.id}')" class="px-5 py-2 rounded-xl text-xs font-bold fin-btn-primary text-white shadow-md transition cursor-pointer btn-press">Tautkan</button>

    async function executeRelinkSetoran(setoranId) {
      const st = state.setoran.find(i => i.id === setoranId);
      const sel = document.getElementById('relink-santri');
      const target = sel ? findSantriById(sel.value) : null;
      if (!st || !target) { showToast('Pilih santri terlebih dahulu.', 'warning'); return; }
      if (!dbClient) { showToast('Firebase belum terhubung.', 'error'); return; }
      const group = state.setoran.filter(i => idStr(i.santri_id) === idStr(st.santri_id) && !findSantriById(i.santri_id));
      const patch = { santri_id: target.id, santri_nis: target.nis || '', santri_username: target.username || '', santri_nama: target.nama_lengkap || '' };
      group.forEach(i => Object.assign(i, patch));
      saveState();
      closeModal();
      renderApp();
      const results = await Promise.all(group.map(i => dbClient.from('setoran_tilawah').update(patch).eq('id', i.id)));
      const gagal = results.find(r => r && r.error);
      try { logAudit(`Menautkan ${group.length} catatan setoran ke santri ${target.nama_lengkap}`); } catch (e) {}
      showToast(gagal ? 'Sebagian gagal disimpan ke server: ' + gagal.error.message
        : `${group.length} catatan setoran berhasil ditautkan ke ${target.nama_lengkap}.`, gagal ? 'error' : 'success');
    }

    function parseWaktuKeMenit(waktuStr) {
      if (!waktuStr) return -1;
      const m = waktuStr.match(/(\d{1,2}):(\d{2})/);
      if (!m) return -1;
      return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    }

    function evaluasiSantriTeladanOtomatis(silent = false, resetManual = false) {
      const now = new Date();
      const currentYearMonth = now.toISOString().slice(0, 7);
      const startMenitPagi = 5 * 60;   // 05:00 WIB
      const endMenitPagi = 12 * 60;    // 12:00 WIB

      let jumlahTeladanTerpilih = 0;

      state.santri.forEach(s => {
        if (resetManual) {
          delete s._teladan_removed;
        }

        const setoranBulanIni = state.setoran.filter(st => 
          st.santri_id === s.id && 
          !st.is_hidden_in_app && 
          (st.tanggal || '').startsWith(currentYearMonth)
        );

        const setoranPagi = setoranBulanIni.filter(st => {
          if (isIzinSakitRecord(st) && state.config.izinSakitJagaTeladan !== false) return true;
          const menit = parseWaktuKeMenit(st.waktu);
          return menit >= startMenitPagi && menit <= endMenitPagi;
        });

        const isKonsistenPagi = setoranBulanIni.length > 0 && (setoranPagi.length === setoranBulanIni.length);
        const lolosKriteria = (s.status_akun === 'aktif') && ((s.total_alpa || 0) === 0) && isKonsistenPagi && !s._teladan_removed;

        const statusLama = s.is_teladan;
        s.is_teladan = lolosKriteria;

        s._teladanDetail = {
          totalSetoranBulan: setoranBulanIni.length,
          setoranPagiCount: setoranPagi.length,
          persenKonsistensi: setoranBulanIni.length > 0 ? Math.round((setoranPagi.length / setoranBulanIni.length) * 100) : 0,
          bulanEvaluasi: currentYearMonth
        };

        if (s.is_teladan) {
          jumlahTeladanTerpilih++;
        }

        if (dbClient && s.is_teladan !== statusLama) {
          dbClient.from('santri').update({ is_teladan: s.is_teladan }).eq('id', s.id).then(() => {});
        }
      });

      saveState();

      if (!silent) {
        logAudit(`Sistem mengevaluasi otomatis Santri Teladan bulan ${currentYearMonth} (kriteria 05:00 - 12:00 WIB).`);
        showToast(`Evaluasi selesai: ${jumlahTeladanTerpilih} Santri Teladan terpilih otomatis berdasarkan konsistensi setoran jam 05.00-12.00 WIB.`, 'success');
        renderApp();
      }
    }

    async function simpanDataIzinSakit({ santriId, tanggal, kategori, catatan, namaWali, kompensasiAlpa, diajukanOleh }) {
      const s = state.santri.find(item => item.id === santriId);
      if (!s) throw new Error('Data santri tidak ditemukan.');

      const targetDate = tanggal || operationalDate();
      const existing = state.setoran.find(st => st.santri_id === santriId && st.tanggal === targetDate && !st.is_hidden_in_app);
      if (existing && !isIzinSakitRecord(existing)) {
        throw new Error(`Santri ${s.nama_lengkap} sudah mengirim rekaman setoran tilawah pada tanggal ${targetDate}.`);
      }

      const newId = existing ? existing.id : ('set-sakit-' + Date.now());
      let fileUrl = existing ? (existing.file_url || '') : '';
      let fileName = existing ? (existing.file_nama || '') : '';

      if (tempIzinSakitFileBlob) {
        if (dbClient) {
          try {
            fileUrl = await uploadPermanent(tempIzinSakitFileBlob, 'izin-sakit');
            localMediaBlobs[newId] = fileUrl;
          } catch (uploadErr) {
            console.warn('Lampiran izin sakit gagal diunggah:', uploadErr);
            localMediaBlobs[newId] = URL.createObjectURL(tempIzinSakitFileBlob);
            showToast('Lampiran gagal diunggah; keterangan izin sakit tetap disimpan.', 'warning');
          }
        } else {
          localMediaBlobs[newId] = URL.createObjectURL(tempIzinSakitFileBlob);
        }
        fileName = 'IZIN_SAKIT_' + tempIzinSakitFileName.replace(/[^a-zA-Z0-9._-]/g, '_');
      } else if (!fileName) {
        fileName = `IZIN_SAKIT_${targetDate}.txt`;
      }

      const p = wibParts();
      const waktuStr = `${p.hour}:${p.minute}:${p.second}`;
      const alasanLengkap = catatan ? `${kategori} (${catatan})` : kategori;

      const setoranRow = {
        id: newId,
        santri_id: santriId,
        tanggal: targetDate,
        waktu: waktuStr,
        tipe_file: 'audio',
        surah: `[IZIN SAKIT] ${alasanLengkap}`,
        ayat: `Kompensasi Sakit • Wali: ${namaWali || s.nama_wali || 'Wali Santri'}`,
        file_nama: fileName,
        file_url: fileUrl,
        ukuran_file: 'Kompensasi Sakit',
        durasi: 'Izin Sakit',
        status: 'valid',
        is_hidden_in_app: false
      };

      if (dbClient) {
        try {
          const savedRow = await persistRecord('setoran_tilawah', setoranRow, existing ? existing.id : undefined);
          Object.assign(setoranRow, savedRow);
        } catch (dbErr) {
          console.warn('Simpan lokal izin sakit (mode preview/offline):', dbErr);
        }
      }

      if (existing) {
        Object.assign(existing, setoranRow);
      } else {
        state.setoran.unshift(setoranRow);
      }

      // Catat juga di state.izin_sakit
      state.izin_sakit = (state.izin_sakit || []).filter(item => !(item.santri_id === santriId && item.tanggal === targetDate));
      state.izin_sakit.unshift({
        id: 'izs-' + newId,
        setoran_id: newId,
        santri_id: santriId,
        tanggal: targetDate,
        waktu: waktuStr,
        alasan: alasanLengkap,
        keterangan: `Wali: ${namaWali || s.nama_wali} • Diajukan oleh: ${diajukanOleh}`,
        file_url: fileUrl,
        file_nama: fileName,
        status_kompensasi: 'aktif_bebas_alpa'
      });

      // Hapus riwayat alpa pada tanggal tersebut bila ada, atau kurangi alpa jika kompensasiAlpa diaktifkan
      const alpaTanggalIdx = state.riwayat_alpa.findIndex(ra => ra.santri_id === santriId && (ra.tanggal === targetDate || ra.tanggal_alpa === targetDate));
      let alpaDikompensasi = false;

      if (alpaTanggalIdx !== -1) {
        const removedAlpa = state.riwayat_alpa.splice(alpaTanggalIdx, 1)[0];
        alpaDikompensasi = true;
        if (dbClient && removedAlpa?.id) {
          dbClient.from('riwayat_alpa').delete().eq('id', removedAlpa.id).then(() => {});
        }
      } else if (kompensasiAlpa && state.riwayat_alpa.some(ra => ra.santri_id === santriId)) {
        const lastAlpaIdx = state.riwayat_alpa.findIndex(ra => ra.santri_id === santriId);
        if (lastAlpaIdx !== -1) {
          const removedAlpa = state.riwayat_alpa.splice(lastAlpaIdx, 1)[0];
          alpaDikompensasi = true;
          if (dbClient && removedAlpa?.id) {
            dbClient.from('riwayat_alpa').delete().eq('id', removedAlpa.id).then(() => {});
          }
        }
      }

      if ((kompensasiAlpa || alpaDikompensasi) && (s.total_alpa || 0) > 0) {
        s.total_alpa = Math.max(0, (s.total_alpa || 0) - 1);
        alpaDikompensasi = true;
        if (s.status_akun === 'terblokir' && s.total_alpa < state.config.batasAlpa) {
          s.status_akun = 'aktif';
          s.alasan_blokir = '';
        }
        if (dbClient) {
          dbClient.from('santri').update({
            total_alpa: s.total_alpa,
            status_akun: s.status_akun,
            alasan_blokir: s.alasan_blokir || ''
          }).eq('id', s.id).then(() => {});
        }
      }

      tempIzinSakitFileBlob = null;
      tempIzinSakitFileName = '';
      saveState();

      logAudit(`Kompensasi Izin Sakit tercatat untuk ${s.nama_lengkap} (${targetDate}): ${alasanLengkap}${alpaDikompensasi ? ' [Alpa Dikompensasi]' : ' [Izin Sakit]'}`);
      return { setoranRow, santri: s, alpaDikompensasi };
    }

    async function handleAdminIzinSakitSubmit(e) {
      e.preventDefault();
      const form = e.target;
      if (form.dataset.saving === '1') return;
      form.dataset.saving = '1';
      const btn = form.querySelector('button[type="submit"]');
      if (btn) btn.disabled = true;
      try {
        const santriId = document.getElementById('admin-sakit-santri').value;
        const tanggal = document.getElementById('admin-sakit-tanggal').value;
        const kategori = document.getElementById('admin-sakit-kategori').value;
        const catatan = document.getElementById('admin-sakit-catatan').value.trim();
        const namaWali = document.getElementById('admin-sakit-wali').value.trim();
        const kompensasiAlpa = document.getElementById('admin-sakit-kompensasi-alpa').checked;

        const res = await simpanDataIzinSakit({
          santriId,
          tanggal,
          kategori,
          catatan,
          namaWali,
          kompensasiAlpa,
          diajukanOleh: 'Admin/Ustadz'
        });

        closeModal();
        showToast(`Kompensasi Izin Sakit ${res.santri.nama_lengkap} aktif! Santri tidak dianggap Alpa pada ${tanggal}.${res.alpaDikompensasi ? ' (1 Poin Alpa telah dikompensasi)' : ''}`, 'success');
        renderApp();
      } catch (err) {
        showToast(err.message || String(err), 'error');
      } finally {
        delete form.dataset.saving;
        if (btn) btn.disabled = false;
      }
    }

    async function handleSantriIzinSakitSubmit(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'santri') return;
      if (state.config.izinSakitMandiriSantri === false) {
        showToast('Pengajuan izin sakit mandiri sedang dinonaktifkan. Hubungi Ustadz pembimbing.', 'warning');
        return;
      }
      const form = e.target;
      if (form.dataset.saving === '1') return;
      form.dataset.saving = '1';
      const btn = form.querySelector('button[type="submit"]');
      if (btn) btn.disabled = true;
      try {
        const santri = currentUser.data;
        const today = operationalDate();
        const kategori = document.getElementById('santri-sakit-kategori').value;
        const catatan = document.getElementById('santri-sakit-catatan').value.trim();
        const namaWali = document.getElementById('santri-sakit-wali').value.trim() || santri.nama_wali;

        const res = await simpanDataIzinSakit({
          santriId: santri.id,
          tanggal: today,
          kategori,
          catatan,
          namaWali,
          kompensasiAlpa: false,
          diajukanOleh: 'Santri/Wali'
        });

        currentUser.data = res.santri;
        localStorage.setItem('ktb_session', JSON.stringify(currentUser));
        activeSantriSetoranMode = 'tilawah';
        showToast('Syafakallah! Izin sakit berhasil tercatat. Anda mendapat kompensasi dan TIDAK dianggap Alpa hari ini.', 'success');
        renderApp();
      } catch (err) {
        showToast(err.message || String(err), 'error');
      } finally {
        delete form.dataset.saving;
        if (btn) btn.disabled = false;
      }
    }

      const pesan = `Assalamu'alaikum Ayah/Bunda ${s.nama_wali}.

Kami telah menerima konfirmasi izin sakit untuk ananda *${s.nama_lengkap}* (${info.alasan}).

Sistem *SETIAKU Kitabunaa* telah memberikan *kompensasi/keringanan otomatis* sehingga ananda *TIDAK dianggap Alpa* pada hari ini.

_Syafakallah syifaan ajilan, syifaan la yughadiru saqaman._ Semoga Allah segera mengangkat sakit ananda dan memberikan kesembuhan yang sempurna. Aamiin.

Jazakumullahu khairan.
*Rumah Qur'an Kitabunaa*`;

      sendWhatsAppViaFonnte(s.no_wa_wali, pesan, s.id, 'konfirmasi_izin_sakit');

      renderApp();
      if (r) { r.__resetScroll = false; if (changed) r.scrollTop = 0; }

    function handleSurahChange() {
      const select = document.getElementById('input-surah');
      if (!select) return;
      const idx = parseInt(select.value, 10);
      const s = QURAN_SURAHS[idx];
      if (s) {
        const inputSelesai = document.getElementById('input-ayat-selesai');
        const inputMulai = document.getElementById('input-ayat-mulai');
        if (inputMulai) { inputMulai.max = s.ayat; inputMulai.value = 1; }
        if (inputSelesai) {
          inputSelesai.max = s.ayat;
          inputSelesai.value = s.ayat;
        }
      }
    }

    function handleSantriTugasUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      tempSantriTugasFileBlob = file;
      tempSantriTugasFileName = file.name;
      const info = document.getElementById('label-kumpul-tugas-info');
      if (info) {
        info.innerHTML = `✓ Berkas terpilih: <b>${escapeHtmlText(file.name)}</b> (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;
        info.className = 'text-[11px] text-emerald-400 font-bold mt-1.5';
      }
    }

    async function saveKumpulTugas(e, tugasId) {
      e.preventDefault();
      const form = e.target;
      if (form.dataset.saving === '1') return;
      form.dataset.saving = '1';
      const submit = form.querySelector('button[type="submit"]');
      if (submit) submit.disabled = true;
      try {
        if (!currentUser || currentUser.role !== 'santri') return;
        if (!tempSantriTugasFileBlob) {
          showToast('Silakan pilih berkas jawaban tugas terlebih dahulu!', 'warning');
          return;
        }
        if (!dbClient) throw new Error('Firebase belum terhubung. Data belum disimpan ke server.');
        const file = tempSantriTugasFileBlob;
        const row = {
          id: 'pt-' + Date.now(),
          tugas_id: tugasId,
          santri_id: currentUser.data.id,
          file_nama: tempSantriTugasFileName,

    /* Pastikan akun santri yang sedang login benar-benar ada di database (cocokkan ID, lalu username/NIS) */
    function ensureSantriSession() {
      if (!currentUser || currentUser.role !== 'santri') return true;
      if (!window.__setiakuSynced) return true;
      const cur = currentUser.data || {};
      let latest = state.santri.find(r => String(r.id) === String(cur.id));
      if (!latest) {
        const norm = v => String(v || '').toLowerCase().replace(/[\s\-_.]/g, '');
        latest = state.santri.find(r => norm(r.username) && norm(r.username) === norm(cur.username))
              || state.santri.find(r => norm(r.nis) && norm(r.nis) === norm(cur.nis));
      }
      if (!latest) return false;
      currentUser.data = latest;
      try { localStorage.setItem('ktb_session', JSON.stringify(currentUser)); } catch (e) {}
      return true;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const role = document.querySelector('input[name="auth_role"]:checked')?.value || 'santri';
      const idInput = document.getElementById('login-id').value.trim();
      const passInput = document.getElementById('login-pass').value.trim();

      if (!idInput || !passInput) {
        showToast('Silakan isi Username/NIS dan Kata Sandi!', 'warning');
        return;
      }

      if (role === 'admin') {
        const expectedUser = (state.config.adminUsername || 'admin').toLowerCase();
        const expectedPass = state.config.adminPassword || 'admin123';

        if (idInput.toLowerCase() === expectedUser && passInput === expectedPass) {
          currentUser = { role: 'admin', nama: 'Ustadz Pengelola' };
          localStorage.setItem('ktb_session', JSON.stringify(currentUser));
          logAudit('Pengelola berhasil login ke sistem.');
          showToast('Ahlan wa Sahlan, Pengelola Kitabunaa!', 'success');
          renderApp();
        } else {
          showToast('Kredensial Admin tidak cocok. Periksa kembali username dan kata sandi.', 'error');
        }
      } else {
        if (dbClient && !window.__setiakuSynced) {
          try { showToast('Memeriksa data santri…', 'info'); await syncAllDataFromFirebase(); } catch (x) { console.warn(x); }
        }
        const cleanInput = idInput.toLowerCase().replace(/[\s\-_.]/g, '');
        const found = state.santri.find(s => {
          const cUser = (s.username || '').toLowerCase().replace(/[\s\-_.]/g, '');
          const cNis = (s.nis || '').toLowerCase().replace(/[\s\-_.]/g, '');
          return (cUser === cleanInput || cNis === cleanInput) && s.password === passInput;
        });

        if (found) {
          if (found.status_akun === 'terblokir') {
            showToast('Akun Anda dinonaktifkan/terblokir karena batas alpa. Hubungi Ustadz pembimbing (atau ajukan kompensasi jika karena sakit).', 'error');
            return;
          }
          currentUser = { role: 'santri', data: found };
          localStorage.setItem('ktb_session', JSON.stringify(currentUser));
          logAudit(`Santri login: ${found.nama_lengkap} (${found.nis})`);
          showToast(`Ahlan wa Sahlan, ${found.nama_lengkap}!`, 'success');
          renderApp();
        } else {
          showToast('Username, NIS, atau Kata Sandi salah.', 'error');
        }
      }
    }

    async function handleSantriSetoranSubmit(e) {
      e.preventDefault();
      const form = e.target;
      if (form.dataset.saving === '1') return;
      form.dataset.saving = '1';
      const submit = form.querySelector('button[type="submit"]');
      if (submit) submit.disabled = true;
      setoranBusy = true;
      try {
        if (!currentUser || currentUser.role !== 'santri') return;
        try { await loadOperationalSettings(true); } catch (e) {}
        if (!setoranOpen()) { showToast(`Setoran ditutup. Operasional ${state.config.jamBuka}\u2013${state.config.jamTutup} WIB.`, 'warning'); return; }
        if (!ensureSantriSession()) {
          showToast('Akun Anda tidak ditemukan di database. Silakan keluar lalu login ulang sebelum mengirim setoran.', 'error');
          return;
        }
        if (dbClient && !window.__setiakuSynced) {
          showToast('Memeriksa data akun ke server…', 'info');
          try { await syncAllDataFromFirebase(); } catch (e) { console.warn(e); }
        }
        if (!currentUser || currentUser.role !== 'santri') return;
        if (!window.__setiakuSynced) {
          showToast('Data akun belum tersinkron dengan server. Periksa koneksi internet, tekan Refresh, lalu kirim ulang.', 'warning');
          return;
        }
        const santriRow = ensureSantriSession() ? findSantriById(currentUser.data.id) : null;
        if (!santriRow) {
          showToast('Akun Anda tidak ditemukan di database. Silakan keluar lalu login ulang sebelum mengirim setoran.', 'error');
          return;
        }
        const santriId = santriRow.id;
        const today = operationalDate();

        if (state.setoran.find(s => idStr(s.santri_id) === idStr(santriId) && s.tanggal === today && !s.is_hidden_in_app)) {
          showToast('Anda sudah tercatat menyetor atau izin sakit hari ini!', 'warning');
          return;
        }

        if (!tempSantriSetoranFileBlob) {
          showToast('Silakan pilih berkas rekaman tilawah Anda terlebih dahulu!', 'warning');
          return;
        }

        const surahIdx = document.getElementById('input-surah').value;
        const surahObj = QURAN_SURAHS[surahIdx];
        const ayatMulai = parseInt(document.getElementById('input-ayat-mulai').value || '1', 10);
        const ayatSelesai = parseInt(document.getElementById('input-ayat-selesai').value || surahObj.ayat, 10);
        if (!surahObj || !Number.isInteger(ayatMulai) || !Number.isInteger(ayatSelesai)
          || ayatMulai < 1 || ayatSelesai > surahObj.ayat || ayatMulai > ayatSelesai) {
          showToast(`Rentang ayat tidak valid. ${surahObj ? surahObj.nama : 'Surah'} memiliki ${surahObj ? surahObj.ayat : '-'} ayat.`, 'warning');
          return;
        }
        const mediaType = document.querySelector('input[name="setoran_media_type"]:checked')?.value || 'audio';

        const newId = 'set-' + Date.now();
        let objectUrl = '';
        try {
          objectUrl = await uploadPermanent(tempSantriSetoranFileBlob, 'setoran');
        } catch (uploadErr) {
          console.warn('Unggah rekaman setoran gagal:', uploadErr);
          throw new Error('Rekaman gagal diunggah sehingga setoran BELUM terkirim. ' + ((uploadErr && uploadErr.message) || '') + ' Coba lagi, atau kirim rekaman yang lebih singkat (maks. 10 MB setelah diperkecil otomatis).');
        }
        localMediaBlobs[newId] = objectUrl;

        const p = wibParts();
        const waktuStr = `${p.hour}:${p.minute}:${p.second}`;

        const newSetoran = {
          id: newId,
          santri_id: santriId,
          santri_nis: santriRow.nis || '',
          santri_username: santriRow.username || '',
          santri_nama: santriRow.nama_lengkap || '',
          tanggal: today,
          waktu: waktuStr,
          tipe_file: mediaType,
          surah: surahObj.nama,
          ayat: `Ayat ${ayatMulai} - ${ayatSelesai}`,
          file_nama: tempSantriSetoranFileName,
          file_url: objectUrl,
          ukuran_file: `${(tempSantriSetoranFileBlob.size / (1024 * 1024)).toFixed(1)} MB`,
          status: 'valid',
          is_hidden_in_app: false
        };

        try {
          Object.assign(newSetoran, await persistRecord('setoran_tilawah', newSetoran));
        } catch (dbErr) {
          console.warn('Simpan setoran gagal:', dbErr);
          throw new Error('Setoran belum tersimpan ke server: ' + ((dbErr && dbErr.message) || dbErr));
        }
        state.setoran.unshift(newSetoran);
        tempSantriSetoranFileBlob = null;
        tempSantriSetoranFileName = '';
        saveState();

        showToast('Alhamdulillah! Setoran tilawah berhasil dikirim.', 'success');
        renderApp();
      } catch (err) {
        console.error(err);
        showToast('Gagal menyimpan: ' + (err.message || String(err)), 'error');
      } finally {
        delete form.dataset.saving;
        if (submit) submit.disabled = false;
        setoranBusy = false;
        updateSetoranLock();
      }
    }

    async function sendWhatsAppViaFonnte(target, message, santriId = null, type = 'manual') {
      const cleanMsg = cleanWhatsAppText(message);
      if (!state.config.fonnteToken) {
        showToast('Token Fonnte belum dikonfigurasi di Pengaturan!', 'warning');
        return;
      }

      showToast(`Mengirim WhatsApp ke ${target}...`, 'info');

      try {
        const res = await fetch('https://api.fonnte.com/send', {
          method: 'POST',
          headers: {
            'Authorization': state.config.fonnteToken,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            target: target,
            message: cleanMsg,
            countryCode: '62'
          })
        });
        const data = await res.json();
        const success = !!data.status;

        const logEntry = {
          id: 'wa-' + Date.now(),
          santri_id: santriId,
          nomor_tujuan: target,
          tanggal_kirim: wibDate(),
          tipe_pesan: type,
          status: success ? 'berhasil' : 'gagal',
          pesan_terkirim: cleanMsg,
          response_payload: data
        };

        state.log_whatsapp.unshift(logEntry);
        saveState();

        if (dbClient) {
          dbClient.from('log_whatsapp').insert([logEntry]).then(() => {});
        }

        if (success) {
          showToast(`WhatsApp berhasil terkirim ke ${target}`, 'success');
        } else {
          showToast(`Gagal kirim WA: ${data.reason || 'Periksa token Fonnte'}`, 'error');
        }
      } catch (err) {
        showToast('Gagal menghubungi server WhatsApp Fonnte', 'error');
      }
    }

    async function jalankanEvaluasiAlpaOtomatis(silent = false) {
      if (operationalBusy) return;
      operationalBusy = true;
      try {
        if (dbClient) {
          const {data,error} = await dbClient.rpc('kitabunaa_evaluate_alpa_v2');
          if (error) throw error;
          if (Number(data) > 0 || !silent) await syncAllDataFromFirebase();
          if (!silent) {
            const izinCount = state.setoran.filter(s => s.tanggal === operationalDate() && !s.is_hidden_in_app && isIzinSakitRecord(s)).length;
            showToast(`Evaluasi selesai: ${data || 0} alpa baru (${izinCount} santri Izin Sakit dikecualikan).`, 'info');
          }
        }
      } catch (error) {
        console.warn('Evaluasi alpa:',error);
        if (!silent) showToast('Evaluasi gagal: '+error.message,'error');
      } finally { operationalBusy = false; }
    }

    async function saveSantriBaru(e) {
      e.preventDefault();
      const form = e.target;
      if (form.dataset.saving === '1') return;
      form.dataset.saving = '1';
      const submit = form.querySelector('button[type="submit"]');
      if (submit) { submit.disabled = true; submit.textContent = 'Menyimpan…'; }
      const DEFAULT_FOTO = 'https://images.unsplash.com/photo-1544717305-2782549b5136?w=200&auto=format&fit=crop&q=80';
      const fotoFile = tempSantriFotoFile;
      const previewUrl = tempSantriFotoBlobUrl;
      try {
        const newSantri = {
          id: 's-' + Date.now(),
          nis: document.getElementById('santri-nis').value.trim(),
          username: document.getElementById('santri-username').value.trim(),
          nama_lengkap: document.getElementById('santri-nama').value.trim(),
          kelas_id: document.getElementById('santri-kelas').value,
          password: document.getElementById('santri-password').value.trim(),
          nama_wali: document.getElementById('santri-wali').value.trim(),
          no_wa_wali: document.getElementById('santri-wa').value.trim(),
          foto_url: DEFAULT_FOTO,
          status_akun: 'aktif',
          total_alpa: 0,
          is_teladan: false
        };
        const row = Object.assign({}, newSantri);
        if (!dbClient) throw new Error('Firebase belum terhubung. Data belum disimpan ke server.');

        /* 1) Tampil seketika di daftar, modal langsung tertutup */
        const localCopy = Object.assign({}, newSantri, { foto_url: previewUrl || DEFAULT_FOTO });
        state.santri.unshift(localCopy);
        tempSantriFotoFile = null;
        tempSantriFotoBlobUrl = null;
        saveState();
        logAudit(`Menambahkan santri baru: ${newSantri.nama_lengkap} (${newSantri.nis})`);
        closeModal();
        renderApp();

        /* 2) Simpan data lalu unggah foto di latar belakang */
        (async () => {
          const modalOpen = () => { const m = document.getElementById('modal-container'); return !!m && !m.classList.contains('hidden'); };
          try {
            const saved = await persistRecord('santri', row);
            if (saved && saved.created_at) localCopy.created_at = saved.created_at;
            let fotoGagal = false;
            if (fotoFile) {
              try {
                const url = await uploadPermanent(fotoFile, 'foto-santri');
                await persistRecord('santri', { foto_url: url }, newSantri.id);
                localCopy.foto_url = url;
              } catch (upErr) {
                console.warn('Unggah foto santri:', upErr);
                fotoGagal = true;
              }
            }
            saveState();
            showToast(fotoGagal ? 'Santri tersimpan, tetapi foto gagal diunggah. Buka Edit untuk mengunggah ulang.' : 'Santri baru berhasil ditambahkan.',
              fotoGagal ? 'warning' : 'success');
          } catch (err) {
            console.error(err);
            const idx = state.santri.indexOf(localCopy);
            if (idx >= 0) state.santri.splice(idx, 1);
            saveState();
            showToast('Gagal menyimpan santri: ' + (err.message || String(err)), 'error');
          } finally {
            if (!modalOpen()) renderApp();
            if (previewUrl && previewUrl.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(previewUrl), 4000);
          }
        })();
      } catch (err) {
        console.error(err);
        showToast('Gagal menyimpan: ' + (err.message || String(err)), 'error');
        if (submit) { submit.disabled = false; submit.textContent = 'Simpan Santri'; }
      } finally {
        delete form.dataset.saving;
      }
    }
